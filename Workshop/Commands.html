<p>1:</p>
<textarea readonly>ytdlp https://youtu.be/bCF2bcqCkYs</textarea>

<p>2:</p>

ytdlp -o"%(title)s [%(id)s].%(ext)s" --force-overwrites https://youtu.be/bCF2bcqCkYs</textarea>
